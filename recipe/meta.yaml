{% set name = "phik" %}
{% set version = "0.12.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: dfc15a9166ab0dcfe3f5f60de606fe9ce064a09af2dd212e726ed3625b795332

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  # [py<39]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - make  # [linux]
    - cmake >=3.17
    - ninja-base
  host:
    - pip
    - python
    - wheel
    - scikit-build-core >=0.3.3
    - pybind11
  run:
    - python
    - numpy >=1.18.0
    - scipy >=1.5.2
    - pandas >=0.25.1
    - matplotlib-base >=2.2.3
    - joblib >=0.14.1

test:
  source_files:
    - tests
  imports:
    - phik
    - phik.binning
    - phik.data_quality
    - phik.decorators
    - phik.outliers
    - phik.phik
    - phik.significance
    - phik.simcore
    - phik.utils
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest >=4.0.2

about:
  home: https://phik.rtfd.io
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - NOTICE
  summary: Phi_K correlation analyzer library
  description: |
    Phi_K is a new and practical correlation coefficient based on several
    refinements to Pearson's hypothesis test of independence of two variables.
  doc_url: https://phik.readthedocs.io
  dev_url: https://github.com/KaveIO/PhiK

extra:
  recipe-maintainers:
    - cbouss
